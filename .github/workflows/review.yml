name: Review

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable

      - name: Observe pull request
        uses: ./
        with:
          command: observe
          config-path: mr-milchick.github.toml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refine pull request
        uses: ./
        with:
          command: refine
          config-path: mr-milchick.github.toml
          token: ${{ secrets.GITHUB_TOKEN }}
