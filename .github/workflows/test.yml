name: Test

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - gitlab
          - github
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --workspace --locked --no-default-features --features ${{ matrix.features }},slack-app
  shell-tests:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        features:
          - github
    steps:
      - uses: actions/checkout@v4
      - name: Run GitHub Action shell tests
        run: bash tests/github_action.sh
