# Mr. Milchick runtime config for GitLab-oriented runs.
#
# This file holds non-secret operational settings only.
# Keep CI/review metadata in CI env vars, and keep secrets in env too:
# - GITLAB_TOKEN
# - GITHUB_TOKEN
# - MR_MILCHICK_SLACK_BOT_TOKEN
#
# If you want to use a different config file path, set:
# - MR_MILCHICK_CONFIG_PATH=/path/to/other-config.toml
#
# TOML supports env interpolation before parsing:
# - ${VAR} for required env vars
# - ${VAR:-default} for optional env vars with a fallback

[platform]
# Review platform compiled into this binary.
# Valid values:
# - "gitlab"
# - "github"
kind = "gitlab"

# Optional API base URL override.
# Leave this commented for normal gitlab.com usage.
# base_url = "https://gitlab.example.com/api/v4"

[platform.gitlab]
# Optional GitLab label to add when every parsed `milchick-status` entry passed.
# This only works when Milchick actually found pipeline status JSON files.
# If the label is configured but no status data is available, Milchick warns and
# does not plan the label action.
# Deprecated once `label_rules` are configured: the general label rule system
# below is preferred for new setups.
# all_pipelines_pass_label = "ready-to-merge"

# Ordered GitLab label rules. Each matching rule can add and/or remove labels.
# If multiple matching rules mention the same label, the later rule wins.
# `pipeline_state` comes from MR_MILCHICK_PIPELINE_STATE when set
# (passed, failed, running, unknown), otherwise Milchick falls back to parsed
# `milchick-status` files when available.
#
# [[platform.gitlab.label_rules]]
# name = "draft-clears-review-workflow"
# add = []
# remove = ["Ready for review", "Ready for Testing"]
#
# [platform.gitlab.label_rules.when]
# all = [
#   { draft = true },
# ]
#
# [[platform.gitlab.label_rules]]
# name = "tests-are-failing"
# add = ["Tests are failing"]
# remove = ["Ready for Testing"]
#
# [platform.gitlab.label_rules.when]
# all = [
#   { pipeline_state = "failed" },
# ]
#
# [[platform.gitlab.label_rules]]
# name = "ready-for-review"
# add = ["Ready for review"]
# remove = ["Tests are failing"]
#
# [platform.gitlab.label_rules.when]
# all = [
#   { draft = false },
#   { merge_request_state = "opened" },
#   { pipeline_state = "passed" },
#   { approvals = "missing" },
# ]
#
# [[platform.gitlab.label_rules]]
# name = "ready-for-testing"
# add = ["Ready for Testing"]
# remove = ["Ready for review", "Tests are failing"]
#
# [platform.gitlab.label_rules.when]
# all = [
#   { draft = false },
#   { merge_request_state = "opened" },
#   { pipeline_state = "passed" },
#   { approvals = "satisfied" },
# ]
#
# [[platform.gitlab.label_rules]]
# name = "closed-or-merged-cleanup"
# add = []
# remove = ["Ready for review", "Ready for Testing", "Tests are failing"]
#
# [platform.gitlab.label_rules.when]
# any = [
#   { merge_request_state = "closed" },
#   { merge_request_state = "merged" },
# ]
#
# [[platform.gitlab.label_rules]]
# name = "all-predicate-examples"
# add = ["Example label to add"]
# remove = ["Example label to remove"]
#
# [platform.gitlab.label_rules.when]
# all = [
#   { draft = false },
#   { merge_request_state = "opened" },
#   { pipeline_state = "passed" },
#   { approvals = "satisfied" },
#   { has_label = "Ready for review" },
#   { has_no_labels = false },
#   { source_branch = "feat/example" },
#   { target_branch = "develop" },
#   { source_branch_kind = "feature" },
# ]

[areas]
# v5 requires each repository to define its own area map. Reviewer routing and
# observe risk labels use these keys.

[[areas.definitions]]
key = "apps"
paths = ["apps/**"]
risk = "medium"

[[areas.definitions]]
key = "packages"
paths = ["packages/**", "libs/**"]
risk = "medium"

[[areas.definitions]]
key = "ci"
paths = [".gitlab-ci.yml", ".github/**", "scripts/**"]
risk = "high"

[[areas.definitions]]
key = "docs"
paths = ["docs/**", "README.md"]
risk = "low"

[observe]
draft_label = "status::draft"

[observe.risk]
low_label = "risk::low"
medium_label = "risk::medium"
high_label = "risk::high"

[observe.description]
required = true
template_paths = [".gitlab/merge_request_templates/Default.md", ".gitlab/merge_request_template.md"]
ignore_branch_issue_key = true

[execution]
# When true, `refine` behaves like a dry run and will not mutate the platform.
# dry_run = true

# Controls when notifications are emitted.
# Valid values:
# - "always"
# - "on-applied-action"
notification_policy = "always"

[reviewers]
# Maximum number of area-routed reviewers to assign from `reviewers.definitions`.
# Mandatory reviewers and fallback behavior are resolved independently of this cap.
# max_reviewers = 2

# Define reviewer routing entries under [[reviewers.definitions]].
# Supported fields:
# - username   : required review-platform username
# - areas      : optional list of owned areas
# - fallback   : optional boolean, used when no area match is found
# - mandatory  : optional boolean, always include this reviewer

# Example fallback reviewer:
# [[reviewers.definitions]]
# username = "milchick-duty"
# fallback = true

# Example mandatory reviewer:
# [[reviewers.definitions]]
# username = "principal-reviewer"
# mandatory = true

# Example area-based reviewers:
# [[reviewers.definitions]]
# username = "alice"
# areas = ["frontend", "packages"]

# [[reviewers.definitions]]
# username = "carol"
# areas = ["backend"]

[codeowners]
# Enable or disable CODEOWNERS-based routing.
# Defaults to true when omitted.
# enabled = true

# Optional explicit CODEOWNERS path.
# If omitted, Milchick auto-discovers common CODEOWNERS locations.
# path = ".gitlab/CODEOWNERS"

[inference]
# Inference runs only during `explain`. Omit `backend` for backward-compatible
# local llama.cpp inference, or select `backend = "claude-code"` explicitly.
# enabled = false

# Local-only fields (requires the `llm-local` feature):
# backend = "local"
# model_path = "${CI_PROJECT_DIR}/models/review.gguf"
# context_tokens = 4096

# Claude Code-only fields (requires `llm-claude-code`):
# backend = "claude-code"
# model = "fully-versioned-model-name"
# `model` is required when enabled. Aliases are accepted, but a full versioned
# identifier is recommended for reproducible CI behavior. The credential is
# read only from CLAUDE_CODE_OAUTH_TOKEN; never put it in this TOML file.

# Shared fields. Claude Code defaults to 120000 ms; local defaults to 15000 ms.
# timeout_ms = 120000
# max_patch_bytes = 32768
# trace = false

[notifications]
# Notification sink config lives under the nested sections below.
# Uncomment only the sink types that match your compiled features and secrets.

# Slack app sink configuration.
# Requires:
# - binary compiled with `slack-app`
# - MR_MILCHICK_SLACK_BOT_TOKEN in env

# [notifications.slack_app]
# enabled = true
#
# Slack channel ID where review notifications should be posted.
# channel = "C01234567"
#
# Optional Slack API base URL override for tests and local mocks.
# base_url = "https://slack.com/api"
#
# Additional review-platform usernames that opt in to parsed pipeline-failure
# DMs while they are assigned reviewers. The review author is always notified.
# pipeline_failure_dm_users = ["principal-reviewer", "alice"]

# Mapping from review-platform usernames to Slack user IDs. Required for
# parsed pipeline-failure DMs to authors and opted-in assigned reviewers;
# missing mappings never fall back to the shared channel. Also rewrites mentions like `@alice` into
# `<@U123...>`.
    # [notifications.slack_app.user_map]
# "arthur" = "U028DDKDJ4E"
# "principal-reviewer" = "U03D9NN5HB6"
# "bob" = "U028GSCQBUJ"

# Optional pipeline-task status aggregation for Slack templates.
# Milchick recursively scans for JSON files under directories named
# `milchick-status` starting from `search_root`.
#
# [notifications.pipeline_status]
# enabled = true
# fail_pipeline_on_failed = true
# search_root = "${CI_PROJECT_DIR}"

[templates]
# Message template overrides live under the sections below.
# If omitted, Milchick uses built-in defaults.

[templates.risk_emojis]
high = ":alert:"
medium = ":large_yellow_circle:"
low = ":white_circle:"

